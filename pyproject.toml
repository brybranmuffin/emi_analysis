[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emi-analysis"
version = "0.1.0"
description = "Continued pretraining and EMI analysis for congressional speech models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "transformers>=4.43.0",
  "accelerate>=0.30.0",
  "torch>=2.2.0",
  "datasets>=2.19.0",
  "tokenizers>=0.19.0",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "scikit-learn>=1.4.0",
  "tqdm>=4.9.0",
  "pyyaml>=6.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
